<template component="functions-page"
  ><main class="mx-auto max-w-[1880px] px-6 py-10">
    <template if="!editing && !providerEditing"
      ><section
        class="overflow-hidden rounded-2xl border border-stone-700 bg-[#111411]"
      >
        <header
          class="flex items-center justify-between border-b border-stone-700 px-4 py-3"
        >
          <h1 class="text-xl font-bold tracking-tight">AI functions</h1>
          <button
            class="rounded border border-stone-600 bg-stone-500 px-3 py-1 text-lg leading-none text-white"
            on-click="newFunction()"
          >
            +
          </button>
        </header>
        <div
          class="grid grid-cols-[minmax(180px,1fr)_minmax(150px,1fr)_minmax(150px,1fr)_4rem] border-b border-stone-800 bg-stone-800/70 px-4 py-2 text-sm text-stone-400"
        >
          <span>functionName</span><span>provider</span><span>model</span
          ><span></span>
        </div>
        <template for="item of functions"
          ><div
            class="grid grid-cols-[minmax(180px,1fr)_minmax(150px,1fr)_minmax(150px,1fr)_4rem] items-center border-b border-stone-800 px-4 py-2 text-sm"
          >
            <button
              class="text-left text-lime-300"
              on-click="editFunction(item.functionId)"
            >
              {{ item.name || item.functionId }}</button
            ><span class="text-stone-400">{{ item.provider || 'default' }}</span
            ><span class="text-stone-400">{{ item.model || 'default' }}</span
            ><button
              class="rounded bg-stone-500 px-2 py-1 text-xs text-white"
              on-click="editFunction(item.functionId)"
            >
              edit
            </button>
          </div></template
        ><template if="!functions.length"
          ><div class="px-4 py-10 text-center text-sm text-stone-500">
            No functions yet. Use + to create one.
          </div></template
        >
        <footer class="flex justify-end px-4 py-2 text-sm text-stone-300">
          {{ functions.length }} items
        </footer>
      </section>
      <section
        class="mt-6 overflow-hidden rounded-2xl border border-stone-700 bg-[#111411]"
      >
        <header
          class="flex items-center justify-between border-b border-stone-700 px-4 py-3"
        >
          <h2 class="text-xl font-bold tracking-tight">Providers</h2>
          <button
            class="rounded border border-stone-600 bg-stone-500 px-3 py-1 text-lg leading-none text-white"
            on-click="newProvider()"
          >
            +
          </button>
        </header>
        <div
          class="grid grid-cols-[1fr_1.4fr_1fr_5rem] border-b border-stone-800 bg-stone-800/70 px-4 py-2 text-sm text-stone-400"
        >
          <span>slug</span><span>url</span><span>default model</span
          ><span></span>
        </div>
        <template for="provider of providers"
          ><div
            class="grid grid-cols-[1fr_1.4fr_1fr_5rem] items-center border-b border-stone-800 px-4 py-2 text-sm"
          >
            <span class="text-lime-300">{{ provider.slug }}</span
            ><span class="truncate text-stone-400">{{ provider.url }}</span
            ><span class="text-stone-400"
              >{{ provider.defaultModel || '—' }}</span
            ><button
              class="rounded bg-stone-500 px-2 py-1 text-xs text-white"
              on-click="editProvider(provider)"
            >
              edit
            </button>
          </div></template
        ><template if="!providers.length"
          ><div class="px-4 py-8 text-center text-sm text-stone-500">
            No providers configured.
          </div></template
        >
      </section></template
    ><template if="editing"
      ><div class="mb-3 flex items-center gap-3 text-xs text-stone-400">
        <button
          class="rounded border border-stone-700 px-3 py-2"
          on-click="showList()"
        >
          ← Functions</button
        ><span>{{ selectedId ? 'Edit function' : 'New function' }}</span>
      </div>
      <function-editor
        bind-function-id="selectedId"
      ></function-editor></template
    ><template if="providerEditing"
      ><div class="mb-3 flex items-center gap-3 text-xs text-stone-400">
        <button
          class="rounded border border-stone-700 px-3 py-2"
          on-click="showList()"
        >
          ← Providers</button
        ><span>{{ providerSlug ? 'Edit provider' : 'New provider' }}</span>
      </div>
      <form
        class="grid gap-4 rounded-lg border border-stone-700 bg-[#0d0f0d] p-5 shadow-2xl"
        on-submit="saveProvider($event)"
      >
        <div
          class="flex items-center justify-between border-b border-stone-700 pb-3"
        >
          <strong class="text-lime-300">aifn.run</strong
          ><span class="text-xs text-stone-500">Provider editor</span>
        </div>
        <div class="grid gap-2">
          <label class="text-xs text-stone-400">Short name</label
          ><input
            class="rounded border border-stone-700 bg-[#0b0d0b] px-3 py-2 text-sm"
            bind-value="providerSlug"
            on-input="setProviderSlug($event.target.value)"
            placeholder="openai"
          />
        </div>
        <div class="grid gap-2">
          <label class="text-xs text-stone-400">URL</label
          ><input
            class="rounded border border-stone-700 bg-[#0b0d0b] px-3 py-2 text-sm"
            bind-value="providerUrl"
            on-input="setProviderUrl($event.target.value)"
            placeholder="https://api.openai.com/v1/chat/completions"
          />
        </div>
        <div class="grid gap-2">
          <label class="text-xs text-stone-400">Default model</label
          ><input
            class="rounded border border-stone-700 bg-[#0b0d0b] px-3 py-2 text-sm"
            bind-value="providerModel"
            on-input="setProviderModel($event.target.value)"
            placeholder="gpt-4o-mini"
          />
        </div>
        <div class="grid gap-2">
          <label class="text-xs text-stone-400">API key</label
          ><input
            class="rounded border border-stone-700 bg-[#0b0d0b] px-3 py-2 text-sm"
            bind-value="providerKey"
            on-input="setProviderKey($event.target.value)"
            type="password"
            placeholder="Leave blank to keep current"
          />
        </div>
        <div class="flex items-center gap-3">
          <button
            class="rounded bg-lime-300 px-4 py-2 font-bold text-stone-950"
            type="submit"
          >
            Save provider</button
          ><span class="text-xs text-stone-400">{{ status }}</span>
        </div>
      </form></template
    >
  </main>
  <script setup>
    import { hook, onInit } from "@li3/web";
    export default function () {
      const params = new URLSearchParams(location.search),
        [functions, setFunctions] = hook([]),
        [providers, setProviders] = hook([]),
        [editing, setEditing] = hook(params.get("view") === "editor"),
        [providerEditing, setProviderEditing] = hook(
          params.get("view") === "provider",
        ),
        [selectedId, setSelectedId] = hook(params.get("id") || ""),
        [providerSlug, setProviderSlug] = hook(params.get("slug") || ""),
        [providerUrl, setProviderUrl] = hook(""),
        [providerModel, setProviderModel] = hook(""),
        [providerKey, setProviderKey] = hook(""),
        [status, setStatus] = hook("");
      function login() { location.href = `/auth/login?return_to=${encodeURIComponent(location.pathname + location.search)}`; }
      async function load() {
        const f = await fetch("/api/fn?visibility=all", {
          credentials: "include",
        });
        if (f.status === 401) return login();
        if (f.ok) setFunctions(await f.json());
        const p = await fetch("/api/providers", { credentials: "include" });
        if (p.status === 401) return login();
        if (p.ok) {
          const list = await p.json();
          setProviders(list);
          const selected = list.find(
            (item) => item.slug === providerSlug.value,
          );
          if (selected) {
            setProviderUrl(selected.url);
            setProviderModel(selected.defaultModel);
          }
        }
      }
      function newFunction() {
        history.pushState({}, "", "/functions?view=editor");
        setSelectedId("");
        setEditing(true);
        setProviderEditing(false);
      }
      function editFunction(id) {
        history.pushState(
          {},
          "",
          `/functions?view=editor&id=${encodeURIComponent(id)}`,
        );
        setSelectedId(id);
        setEditing(true);
        setProviderEditing(false);
      }
      function newProvider() {
        history.pushState({}, "", "/functions?view=provider");
        setProviderSlug("");
        setProviderUrl("");
        setProviderModel("");
        setProviderKey("");
        setEditing(false);
        setProviderEditing(true);
      }
      function editProvider(p) {
        history.pushState(
          {},
          "",
          `/functions?view=provider&slug=${encodeURIComponent(p.slug)}`,
        );
        setProviderSlug(p.slug);
        setProviderUrl(p.url);
        setProviderModel(p.defaultModel);
        setProviderKey("");
        setEditing(false);
        setProviderEditing(true);
      }
      function showList() {
        history.pushState({}, "", "/functions?view=list");
        setEditing(false);
        setProviderEditing(false);
        load();
      }
      async function saveProvider(event) {
        event.preventDefault();
        const response = await fetch("/api/providers", {
          method: "PUT",
          credentials: "include",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            slug: providerSlug.value,
            url: providerUrl.value,
            defaultModel: providerModel.value,
            key: providerKey.value,
          }),
        });
        if (response.status === 401) return login();
        if (!response.ok) {
          setStatus(
            response.status === 401
              ? "Authentication required"
              : "Unable to save",
          );
          return;
        }
        setStatus("Saved");
        setProviderKey("");
        showList();
      }
      onInit(load);
      return {
        functions,
        providers,
        editing,
        providerEditing,
        selectedId,
        providerSlug,
        providerUrl,
        providerModel,
        providerKey,
        status,
        setProviderSlug,
        setProviderUrl,
        setProviderModel,
        setProviderKey,
        newFunction,
        editFunction,
        newProvider,
        editProvider,
        showList,
        saveProvider,
      };
    }
  </script></template
>
