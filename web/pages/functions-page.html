<template component="functions-page">
  <main class="page functions-page">
    <template if="!editing">
      <div class="compact-page-heading"><div><div class="eyebrow">Function library</div><strong class="compact-title">Functions</strong></div><button class="button primary" on-click="newFunction()">New function +</button></div>
      <section class="function-grid" if="functions.length">
        <button class="function-card" for="item of functions" on-click="edit(item.functionId)"><span class="function-card-name">{{ item.name || item.functionId }}</span><span class="function-card-meta">v{{ item.version }} · {{ item.public ? 'Public' : 'Private' }} · {{ item.output }}</span><span class="function-card-edit">Edit</span></button>
      </section>
      <section class="empty-state card" if="!functions.length"><div class="empty-mark">fn</div><h2>No functions yet</h2><p>Create your first function to start building your library.</p><button class="button" on-click="newFunction()">Create a function</button></section>
    </template>
    <template if="editing"><div class="inline-editor-heading"><button class="button" on-click="showList()">← Functions</button><span>{{ selectedId ? 'Edit function' : 'New function' }}</span></div><function-editor bind-function-id="selectedId"></function-editor></template>
  </main>
  <script setup>
    import { hook, onInit } from '@li3/web';
    export default function () {
      const [functions, setFunctions] = hook([]), [editing, setEditing] = hook(location.pathname === '/functions/new'), [selectedId, setSelectedId] = hook('');
      async function load() { const response = await fetch('/api/fn?visibility=all', { credentials: 'include' }); if (response.ok) setFunctions(await response.json()); }
      function newFunction() { setSelectedId(''); setEditing(true); }
      function edit(id) { setSelectedId(id); setEditing(true); }
      function showList() { setEditing(false); load(); }
      onInit(load);
      return { functions, editing, selectedId, newFunction, edit, showList };
    }
  </script>
</template>
