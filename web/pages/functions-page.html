<template component="functions-page">
  <main class="mx-auto min-h-screen max-w-[1880px] px-6 py-8 font-mono text-stone-200">
    <div class="mb-5 flex justify-end">
      <template if="profile">
        <a
          class="flex max-w-72 items-center gap-3 rounded-lg border border-stone-700 bg-[#151815] px-3 py-2 text-left hover:border-lime-300"
          bind-href="profileUrl"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open your account profile in a new tab"
        >
          <template if="profile.photo">
            <img class="h-9 w-9 rounded-full object-cover" bind-src="profile.photo" alt="" />
          </template>
          <template if="!profile.photo">
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-stone-700 text-sm text-stone-100">
              {{ profileInitials }}
            </span>
          </template>
          <span class="flex min-w-0 flex-col">
            <strong class="truncate text-xs text-stone-100">{{ profile.name || 'Signed in' }}</strong>
            <small class="truncate text-[10px] text-stone-400">{{ profile.email }}</small>
          </span>
        </a>
      </template>
    </div>
    <div class="space-y-6" class-hidden="view !== 'list'">
      <header class="mb-5">
        <nav class="border-b border-stone-800 pb-4 text-xs text-stone-400" aria-label="Functions navigation">
          <a class="hover:text-lime-300" href="/">← Home</a>
        </nav>
      </header>
      <section class="max-w-full overflow-x-auto text-sm leading-8 text-[#c5c8d0]">
        <div class="text-sm text-stone-500">// functions</div>
        <div class="text-gray-500"><span class="text-fuchsia-400">const</span> functions = [</div>
        <template for="fn of functions">
          <div class="whitespace-nowrap pl-8">
            <template if="fn.claimable">
              <div class="flex items-center gap-4">
                <span
                  ><span class="text-green-400">{{ fn.name || 'functionName' }}</span>(<span
                    >{{ fn.inputSignature }}</span
                  >),</span
                >
                <button
                  class="rounded border border-amber-500 px-2 py-0.5 text-amber-300 hover:border-amber-300"
                  type="button"
                  on-click="claimFunction(fn)"
                >
                  claim ownership
                </button>
              </div>
            </template>
            <template if="!fn.claimable">
              <button class="text-left hover:underline" on-click="editFunction(fn)">
                <span class="text-green-400">{{ fn.name || 'functionName' }}</span>(<span>{{ fn.inputSignature }}</span
                >),
              </button>
            </template>
          </div>
        </template>
        <template if="!functions.length"><div class="py-2 pl-8 text-stone-500">// no functions yet</div></template>
        <button
          class="ml-8 rounded border border-amber-500 p-1 text-sm text-amber-300 hover:border-amber-300"
          on-click="newFunction()"
        >
          new()
        </button>
        <div class="text-gray-500">];</div>
      </section>
      <section class="mt-8 max-w-full overflow-x-auto text-sm leading-8 text-gray-500">
        <div class="text-sm text-stone-500">// providers</div>
        <div><span class="text-fuchsia-400">const</span> providers = [</div>
        <table class="min-w-[1100px] table-fixed border-collapse text-left">
          <colgroup>
            <col class="w-[2ch]" />
            <col class="w-[14ch]" />
            <col />
            <col class="w-[14ch]" />
            <col />
            <col class="w-[6ch]" />
            <col />
            <col class="w-[2ch]" />
          </colgroup>
          <tbody>
            <template for="provider of providers">
              <tr
                class="cursor-pointer hover:bg-stone-900/40"
                role="button"
                tabindex="0"
                on-click="editProvider(provider)"
                on-keydown="editProviderOnKey($event, provider)"
              >
                <td class="px-1 align-top">{</td>
                <td class="px-1 text-right align-top">name:</td>
                <td class="break-all px-1 align-top text-green-400">'<span>{{ provider.slug }}</span>',</td>
                <td class="px-1 text-right align-top">defaultModel:</td>
                <td class="break-all px-1 align-top text-green-400">'<span>{{ provider.defaultModel }}</span>',</td>
                <td class="px-1 text-right align-top">url:</td>
                <td class="break-all px-1 align-top text-green-400">'<span>{{ provider.url }}</span>'</td>
                <td class="px-1 align-top">},</td>
              </tr>
            </template>
          </tbody>
        </table>
        <template if="!providers.length"><div class="py-2 pl-8 text-stone-500">// no providers yet</div></template>
        <button
          class="ml-8 rounded border border-amber-500 p-1 text-sm text-amber-300 hover:border-amber-300"
          on-click="newProvider()"
        >
          new()
        </button>
        <div>];</div>
      </section>
    </div>

    <link rel="component" href="/components/function-definition-editor.html" />
    <template if="view === 'function-editor'">
      <function-definition-editor
        bind-function-id="selectedId"
        bind-on-cancel="showList"
        bind-on-saved="onFunctionSaved"
      ></function-definition-editor>
    </template>

    <div class-hidden="view !== 'provider-editor'">
      <div class="space-y-1 p-5 font-mono text-sm leading-8">
        <div>
          <span class="text-violet-300">const</span> name =
          <input
            class="w-64 bg-transparent text-lime-300 outline-none placeholder:text-stone-500"
            bind-value="providerName"
            on-input="(setProviderName($event.target.value), $event.target.style.width = (9 * ($event.target.value.length || 10)) + 'px')"
            placeholder="name"
          />
        </div>
        <div>
          <span class="text-violet-300">const</span> url =
          <input
            class="w-[min(100%,42rem)] bg-transparent text-amber-300 outline-none placeholder:text-stone-500"
            bind-value="providerUrl"
            on-input="(setProviderUrl($event.target.value), $event.target.style.width = (9 * ($event.target.value.length || 10)) + 'px')"
            placeholder="url"
          />
        </div>
        <div>
          <span class="text-violet-300">const</span> defaultModel =
          <input
            class="w-56 bg-transparent text-amber-300 outline-none placeholder:text-stone-500"
            bind-value="providerModel"
            on-input="(setProviderModel($event.target.value), $event.target.style.width = (9 * ($event.target.value.length || 10)) + 'px')"
            placeholder="defaultModel"
          />
        </div>
        <div>
          <span class="text-violet-300">const</span> apiKey =
          <input
            class="w-56 bg-transparent text-amber-300 outline-none"
            type="password"
            bind-value="providerKey"
            on-input="(setProviderKey($event.target.value), $event.target.style.width = (9 * ($event.target.value.length || 10)) + 'px')"
            placeholder="optional key"
          />
        </div>
        <div class="mt-4 flex flex-wrap items-center gap-3">
          <button
            class="rounded border border-stone-700 px-4 py-2 hover:border-stone-400"
            type="button"
            on-click="showList()"
          >
            cancel
          </button>
          <button
            class="rounded bg-lime-300 px-4 py-2 font-bold text-stone-950 hover:bg-lime-200 disabled:opacity-50"
            type="button"
            on-click="saveProvider($event)"
            bind-disabled="saving"
          >
            {{ saving ? 'saving...' : 'save' }}
          </button>
          <span class="text-xs text-stone-500">{{ status }}</span>
        </div>
      </div>
    </div>
  </main>
  <script setup>
    import { hook, onInit } from "@li3/web";

    export default function () {
      const params = new URLSearchParams(location.search);
      const [view, setView] = hook(params.get("view") || "list");
      const [profile, setProfile] = hook(null);
      const [profileUrl, setProfileUrl] = hook("");
      const [profileInitials, setProfileInitials] = hook("U");
      const [functions, setFunctions] = hook([]);
      const [providers, setProviders] = hook([]);
      const [selectedId, setSelectedId] = hook(params.get("id") || "");
      const [providerName, setProviderName] = hook(params.get("slug") || "");
      const [providerUrl, setProviderUrl] = hook("");
      const [providerModel, setProviderModel] = hook("");
      const [providerKey, setProviderKey] = hook("");
      const [status, setStatus] = hook("");
      const [saving, setSaving] = hook(false);

      async function loadProfile() {
        try {
          const [sessionResponse, providerResponse] = await Promise.all([
            fetch("/auth/session", { credentials: "include" }),
            fetch("/auth/provider"),
          ]);
          if (sessionResponse.ok) {
            const session = await sessionResponse.json();
            setProfile(session.profile);
            const label = session.profile?.name || session.profile?.email || "User";
            setProfileInitials(
              label
                .trim()
                .split(/\s+/)
                .slice(0, 2)
                .map((part) => part.charAt(0).toUpperCase())
                .join(""),
            );
          }
          if (providerResponse.ok) {
            const provider = await providerResponse.json();
            const issuer = String(provider.url || "").replace(/\/+$/, "");
            if (issuer) setProfileUrl(`${issuer}/me`);
          }
        } catch (error) {
          console.error("Unable to load account profile", error);
        }
      }

      async function load() {
        const [f, p] = await Promise.all([
          fetch("/api/fn?visibility=all", { credentials: "include" }),
          fetch("/api/providers", { credentials: "include" }),
        ]);
        if (f.ok) {
          const firstPage = await f.json();
          const allFunctions = [...firstPage.functions];
          for (let page = 2; (page - 1) * firstPage.pageSize < firstPage.total; page += 1) {
            const response = await fetch(`/api/fn?visibility=all&page=${page}&pageSize=${firstPage.pageSize}`, {
              credentials: "include",
            });
            if (!response.ok) break;
            const nextPage = await response.json();
            allFunctions.push(...nextPage.functions);
          }
          setFunctions(
            allFunctions.map((fn) => ({
              ...fn,
              inputSignature: (fn.inputSchema || []).map((input) => `${input.name}: ${input.type}`).join(", "),
            })),
          );
        }
        if (p.ok) {
          const list = await p.json();
          setProviders(list);
          const selectedProvider = list.find((item) => item.slug === providerName.value);
          if (selectedProvider) {
            setProviderUrl(selectedProvider.url);
            setProviderModel(selectedProvider.defaultModel);
          }
        }
      }

      function route(next, query = "") {
        setView(next);
        history.pushState({}, "", `/functions?view=${next}${query}`);
      }

      function onPopState() {
        const current = new URLSearchParams(location.search);
        setView(current.get("view") || "list");
        setSelectedId(current.get("id") || "");
        setProviderName(current.get("slug") || "");
        load();
      }

      function newFunction() {
        setSelectedId("");
        route("function-editor");
      }

      function editFunction(fn) {
        setSelectedId(fn.functionId);
        route("function-editor", `&id=${encodeURIComponent(fn.functionId)}`);
      }

      async function claimFunction(fn) {
        const name = fn.name || fn.functionId;
        if (!window.confirm(`Claim "${name}" for this account? Only this account will be able to edit it.`)) {
          return;
        }
        try {
          const response = await fetch(`/api/fn/${fn.functionId}/claim`, {
            method: "POST",
            credentials: "include",
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error?.message || `Claim failed (${response.status})`);
          }
          editFunction(fn);
          load();
        } catch (error) {
          window.alert(error.message);
        }
      }

      function newProvider() {
        setProviderName("");
        setProviderUrl("");
        setProviderModel("");
        setProviderKey("");
        route("provider-editor");
      }

      function editProvider(p) {
        setProviderName(p.slug);
        setProviderUrl(p.url);
        setProviderModel(p.defaultModel || "");
        setProviderKey("");
        route("provider-editor", `&slug=${encodeURIComponent(p.slug)}`);
      }

      function editProviderOnKey(event, provider) {
        if (event.key !== "Enter" && event.key !== " ") {
          return;
        }
        event.preventDefault();
        editProvider(provider);
      }

      function showList() {
        route("list");
        load();
      }

      function onFunctionSaved(id) {
        setSelectedId(id);
        history.replaceState({}, "", `/functions?view=function-editor&id=${encodeURIComponent(id)}`);
        load();
      }

      async function saveProvider(e) {
        e.preventDefault();
        setSaving(true);
        try {
          const r = await fetch("/api/providers", {
            method: "PUT",
            credentials: "include",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              slug: providerName.value,
              url: providerUrl.value,
              defaultModel: providerModel.value,
              key: providerKey.value,
            }),
          });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error?.message || r.status);
          setStatus("provider saved");
          setProviderKey("");
          await load();
          showList();
        } catch (e) {
          setStatus(e.message);
        } finally {
          setSaving(false);
        }
      }
      onInit(() => {
        load();
        loadProfile();
        window.addEventListener("popstate", onPopState);
      });
      return {
        view,
        profile,
        profileUrl,
        profileInitials,
        functions,
        providers,
        selectedId,
        providerName,
        providerUrl,
        providerModel,
        providerKey,
        status,
        saving,
        setProviderName,
        setProviderUrl,
        setProviderModel,
        setProviderKey,
        newFunction,
        editFunction,
        claimFunction,
        newProvider,
        editProvider,
        editProviderOnKey,
        showList,
        onFunctionSaved,
        saveProvider,
      };
    }
  </script>
</template>
