<template component="help-page"><main class="mx-auto max-w-6xl px-6 py-12"><div class="text-xs font-bold uppercase tracking-[.2em] text-lime-300">The short version</div><h1 class="mt-3 text-5xl font-bold tracking-[-.06em] md:text-7xl">Build once. Call anywhere.</h1><div class="mt-12 grid gap-4 md:grid-cols-3"><article class="rounded-xl border border-stone-800 bg-[#151815] p-6"><span class="text-xs text-lime-300">01</span><h2 class="mt-16 text-2xl font-bold">Create</h2><p class="mt-3 leading-7 text-stone-400">Write an instruction with placeholders like <code class="text-lime-300">{{text}}</code>. Choose JSON for structured results or text for prose.</p></article><article class="rounded-xl border border-stone-800 bg-[#151815] p-6"><span class="text-xs text-lime-300">02</span><h2 class="mt-16 text-2xl font-bold">Version</h2><p class="mt-3 leading-7 text-stone-400">Every configuration change creates an immutable version. Consumers can use the active version or pin a specific one.</p></article><article class="rounded-xl border border-stone-800 bg-[#151815] p-6"><span class="text-xs text-lime-300">03</span><h2 class="mt-16 text-2xl font-bold">Call</h2><p class="mt-3 leading-7 text-stone-400">Use the HTTP API or a generated client in your own application. Read the raw OpenAPI contract at <a class="text-lime-300" href="/api">/api</a>.</p></article></div></main></template>
