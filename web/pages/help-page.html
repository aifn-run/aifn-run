<template component="help-page"><main class="page help-page"><div class="eyebrow">The short version</div><h1>Build once. Call anywhere.</h1><div class="help-grid"><article class="card"><span class="card-index">01</span><h2>Create</h2><p>Write an instruction with placeholders like <code>{text}</code>. Choose JSON for structured results or text for prose.</p></article><article class="card"><span class="card-index">02</span><h2>Version</h2><p>Every configuration change creates an immutable version. Consumers can use the active version or pin a specific one.</p></article><article class="card"><span class="card-index">03</span><h2>Call</h2><p>Use the HTTP API or a generated client in your own application. Read the raw OpenAPI contract at <a href="/api">/api</a>.</p></article></div></main></template>
