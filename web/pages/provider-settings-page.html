<template component="provider-settings-page"><main class="mx-auto max-w-5xl px-6 py-12"><div class="flex items-end justify-between"><div><div class="text-xs font-bold uppercase tracking-[.2em] text-lime-300">Provider settings</div><h1 class="mt-3 text-5xl font-bold tracking-[-.06em]">Providers</h1></div><button class="rounded bg-lime-300 px-4 py-2 font-bold text-stone-950" on-click="newProvider()">+ Provider</button></div><section class="mt-6 overflow-hidden rounded-xl border border-stone-700 bg-[#111411]"><div class="grid grid-cols-[1fr_1.4fr_1fr_5rem] border-b border-stone-700 bg-stone-800/70 px-4 py-2 text-xs text-stone-400"><span>slug</span><span>url</span><span>default model</span><span></span></div><template for="provider of providers"><div class="grid grid-cols-[1fr_1.4fr_1fr_5rem] items-center border-b border-stone-800 px-4 py-2 text-sm"><span class="text-lime-300">{{ provider.slug }}</span><span class="truncate text-stone-400">{{ provider.url }}</span><span class="text-stone-400">{{ provider.defaultModel || '—' }}</span><button class="rounded bg-stone-500 px-2 py-1 text-xs" on-click="edit(provider)">edit</button></div></template><template if="!providers.length"><div class="px-4 py-8 text-center text-sm text-stone-500">No providers yet.</div></template></section><form class="mt-6 grid gap-4 rounded-xl border border-stone-700 bg-[#151815] p-6" if="editing" on-submit="save($event)"><div class="grid gap-2"><label class="text-xs text-stone-400">Slug</label><input class="rounded border border-stone-700 bg-[#0b0d0b] px-3 py-2 text-sm" bind-value="slug" on-input="setSlug($event.target.value)" placeholder="openai" /></div><div class="grid gap-2"><label class="text-xs text-stone-400">URL</label><input class="rounded border border-stone-700 bg-[#0b0d0b] px-3 py-2 text-sm" bind-value="url" on-input="setUrl($event.target.value)" placeholder="https://api.openai.com/v1/chat/completions" /></div><div class="grid gap-2"><label class="text-xs text-stone-400">Default model</label><input class="rounded border border-stone-700 bg-[#0b0d0b] px-3 py-2 text-sm" bind-value="defaultModel" on-input="setDefaultModel($event.target.value)" placeholder="gpt-4o-mini" /></div><div class="grid gap-2"><label class="text-xs text-stone-400">API key</label><input class="rounded border border-stone-700 bg-[#0b0d0b] px-3 py-2 text-sm" bind-value="key" on-input="setKey($event.target.value)" type="password" placeholder="Leave blank to keep current" /></div><div class="flex gap-3"><button class="rounded bg-lime-300 px-4 py-2 font-bold text-stone-950" type="submit">Save provider</button><button class="rounded border border-stone-700 px-4 py-2" type="button" on-click="cancel()">Cancel</button><span class="self-center text-xs text-stone-400">{{ status }}</span></div></form></main><script setup>import { hook, onInit } from '@li3/web'; export default function () { const params=new URLSearchParams(location.search),[providers,setProviders]=hook([]),[editing,setEditing]=hook(params.get('view')==='edit'),[slug,setSlug]=hook(''),[url,setUrl]=hook(''),[defaultModel,setDefaultModel]=hook(''),[key,setKey]=hook(''),[status,setStatus]=hook(''); async function load(){const r=await fetch('/api/providers',{credentials:'include'});if(r.ok){const list=await r.json();setProviders(list);const selected=list.find((item)=>item.slug===params.get('slug'));if(selected)edit(selected)}} function newProvider(){history.pushState({},'', '/settings/provider?view=edit');setSlug('');setUrl('');setDefaultModel('');setKey('');setEditing(true)} function edit(p){history.pushState({},'',`/settings/provider?view=edit&slug=${encodeURIComponent(p.slug)}`);setSlug(p.slug);setUrl(p.url);setDefaultModel(p.defaultModel);setKey('');setEditing(true)} function cancel(){history.pushState({},'', '/settings/provider?view=list');setEditing(false)} async function save(e){e.preventDefault();const r=await fetch('/api/providers',{method:'PUT',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({slug:slug.value,url:url.value,defaultModel:defaultModel.value,key:key.value})});if(!r.ok){setStatus('Unable to save');return}setStatus('Saved');setKey('');setEditing(false);history.pushState({},'', '/settings/provider?view=list');load()} onInit(load);return {providers,editing,slug,url,defaultModel,key,status,setSlug,setUrl,setDefaultModel,setKey,newProvider,edit,cancel,save};}</script></template>
