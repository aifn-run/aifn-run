<template component="provider-settings-page"
  ><main class="page">
    <div class="eyebrow">Account defaults</div>
    <h1>Provider settings.</h1>
    <p class="lede">
      Set the provider your functions use by default. Individual functions can override the endpoint and key.
    </p>
    <form class="card settings-card" on-submit="save($event)">
      <div class="field">
        <label for="account-endpoint">OpenAI-compatible endpoint</label
        ><input id="account-endpoint" bind-value="endpoint" placeholder="https://api.openai.com/v1/chat/completions" />
      </div>
      <div class="field">
        <label for="account-model">Default model</label
        ><input id="account-model" bind-value="model" placeholder="gpt-4o-mini or llama3.2" />
      </div>
      <div class="field">
        <label for="account-key">API key</label
        ><input
          id="account-key"
          bind-value="key"
          type="password"
          placeholder="{{ configured ? 'Leave blank to keep current key' : 'Paste an API key' }}"
          autocomplete="new-password"
        />
      </div>
      <div class="actions">
        <button class="button primary" type="submit" bind-disabled="busy">
          {{ busy ? 'Saving…' : 'Save defaults' }}</button
        ><span class="status">{{ status }}</span>
      </div>
      <p class="status">Keys are stored in the auth property service and are never returned to the browser.</p>
    </form>
  </main>
  <script setup>
    import { ref, onInit } from '@li3/web';
    export default function () {
      const endpoint = ref(''),
        model = ref(''),
        key = ref(''),
        configured = ref(false),
        busy = ref(false),
        status = ref('');
      onInit(async () => {
        const r = await fetch('/api/provider/account', { credentials: 'include' });
        if (r.ok) {
          const x = await r.json();
          endpoint.value = x.endpoint;
          model.value = x.model;
          configured.value = x.keyConfigured;
        }
      });
      async function save(e) {
        e.preventDefault();
        busy.value = true;
        try {
          const r = await fetch('/api/provider/account', {
            method: 'PUT',
            credentials: 'include',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ endpoint: endpoint.value, model: model.value, key: key.value }),
          });
          if (!r.ok) throw new Error('Unable to save settings');
          configured.value = true;
          key.value = '';
          status.value = 'Saved';
        } catch (e) {
          status.value = e.message;
        } finally {
          busy.value = false;
        }
      }
      return { endpoint, model, key, configured, busy, status, save };
    }
  </script></template
>
