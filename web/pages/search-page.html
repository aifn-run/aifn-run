<template component="search-page">
  <link rel="component" href="/components/function-client-snippet.html" />
  <main class="mx-auto min-h-screen max-w-4xl px-6 py-10 font-mono text-stone-200">
    <header class="mb-5">
      <nav
        class="flex items-center justify-between border-b border-stone-800 pb-4 text-xs text-stone-400"
        aria-label="Browse navigation"
      >
        <a class="hover:text-lime-300" href="/">← Home</a>
        <a class="hover:text-lime-300" href="/functions?view=list">Open editor ↗</a>
      </nav>
      <h1 class="mt-5 text-lg font-bold">Browse functions</h1>
    </header>
    <template for="fn of functions">
      <div class="py-2">
        <button type="button" class="w-full text-left text-sm hover:underline" on-click="toggle(fn)">
          <span class="text-green-400">{{ fn.importName }}</span>(<span>{{ fn.inputSignature }}</span>)
        </button>
        <template if="expandedId === fn.functionId">
          <div class="ml-4 mt-3 border-l border-stone-700 py-2 pl-4">
            <div class="flex flex-wrap gap-x-5 gap-y-1 text-xs text-stone-400">
              <span>output: <b class="text-cyan-300">{{ fn.output }}</b></span>
              <span>model: <b class="text-amber-300">{{ fn.model || 'provider default' }}</b></span>
              <span>provider: <b class="text-lime-300">{{ fn.provider || 'default' }}</b></span>
              <span>{{ fn.public ? 'public' : 'private' }}</span>
            </div>
            <function-client-snippet
              bind-function-id="fn.functionId"
              bind-input-schema="fn.inputSchema"
              bind-function-name="fn.importName"
              bind-output="fn.output"
            ></function-client-snippet>
          </div>
        </template>
      </div>
    </template>
    <template if="!functions.length">
      <div class="py-4 pl-4 text-sm text-stone-500">// no functions on this page</div>
    </template>
    <footer class="mt-5 flex items-center justify-between border-t border-stone-800 pt-4 text-xs text-stone-400">
      <button
        class="rounded border border-stone-700 px-3 py-2 disabled:opacity-40"
        on-click="previous()"
        bind-disabled="page <= 1"
      >
        ← previous
      </button>
      <span>page {{ page }} · {{ total }} functions · 50 per page</span>
      <button
        class="rounded border border-stone-700 px-3 py-2 disabled:opacity-40"
        on-click="next()"
        bind-disabled="!hasNext"
      >
        next →
      </button>
    </footer>
  </main>
  <script setup>
    import { hook, onInit } from "@li3/web";

    const reservedIdentifiers = new Set([
      "arguments",
      "await",
      "break",
      "case",
      "catch",
      "class",
      "const",
      "continue",
      "debugger",
      "default",
      "delete",
      "do",
      "else",
      "enum",
      "eval",
      "export",
      "extends",
      "false",
      "finally",
      "for",
      "function",
      "if",
      "implements",
      "import",
      "in",
      "instanceof",
      "interface",
      "let",
      "new",
      "null",
      "package",
      "private",
      "protected",
      "public",
      "return",
      "static",
      "super",
      "switch",
      "this",
      "throw",
      "true",
      "try",
      "typeof",
      "var",
      "void",
      "while",
      "with",
      "yield",
    ]);

    function toImportName(name, id) {
      const safeName = String(name || "").replace(/[^A-Za-z0-9_$]/g, "_");
      return !safeName || /^\d/.test(safeName) || reservedIdentifiers.has(safeName) ? `fn_${id.slice(0, 8)}` : safeName;
    }

    function signature(schema = []) {
      return schema.map((input) => `${input.name}: ${input.type}`).join(", ");
    }

    export default function () {
      const params = new URLSearchParams(location.search);
      const initialPage = Math.max(1, Number(params.get("page") || 1));
      const [page, setPage] = hook(initialPage);
      const [functions, setFunctions] = hook([]);
      const [total, setTotal] = hook(0);
      const [hasNext, setHasNext] = hook(false);
      const [expandedId, setExpandedId] = hook("");

      async function load(pageNumber = page.value) {
        const response = await fetch(`/api/fn?page=${pageNumber}&pageSize=50`, { credentials: "same-origin" });
        if (!response.ok) {
          setFunctions([]);
          setTotal(0);
          setHasNext(false);
          return;
        }
        const result = await response.json();
        setFunctions(
          result.functions.map((fn) => ({
            ...fn,
            importName: toImportName(fn.name, fn.functionId),
            inputSignature: signature(fn.inputSchema),
          })),
        );
        setPage(result.page);
        setTotal(result.total);
        setHasNext(result.hasNext);
      }

      function toggle(fn) {
        setExpandedId(expandedId.value === fn.functionId ? "" : fn.functionId);
      }

      function go(pageNumber) {
        setPage(pageNumber);
        setExpandedId("");
        history.pushState({}, "", `/browse?page=${pageNumber}`);
        load(pageNumber);
      }

      function previous() {
        if (page.value > 1) go(page.value - 1);
      }

      function next() {
        if (hasNext.value) go(page.value + 1);
      }

      function onPopState() {
        const currentPage = Math.max(1, Number(new URLSearchParams(location.search).get("page") || 1));
        setPage(currentPage);
        load(currentPage);
      }

      onInit(() => {
        load();
        window.addEventListener("popstate", onPopState);
      });

      return { page, functions, total, hasNext, expandedId, toggle, previous, next };
    }
  </script>
</template>
