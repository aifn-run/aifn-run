<template component="app-shell">
  <header class="site-header">
    <a class="brand" href="/">ai<span>fn</span>.run</a>
    <nav class="nav">
      <a href="/">Home</a><a href="/dashboard">Dashboard</a><a href="/functions">Functions</a><a href="/help">Help</a
      ><a href="/settings/provider">Settings</a>
    </nav>
    <div class="auth-actions">
      <template if="!profile"><a class="button" href="/auth/login?return_to=/dashboard">Sign in</a></template
      ><template if="profile"
        ><button class="button profile-button" on-click="signOut()">
          {{ profile.name || profile.email || 'Signed in' }} · Sign out
        </button></template
      >
    </div>
  </header>
  <script setup>
    import { ref, onInit } from '@li3/web';
    export default function () {
      const profile = ref(null);
      const signOut = async () => { await fetch('/auth/logout', { method: 'POST' }); location.href = '/'; };
      onInit(async () => {
        try { const response = await fetch('/auth/session'); if (response.ok) profile.value = (await response.json()).profile; } catch {}
      });
      return { profile, signOut };
    }
  </script>
</template>
