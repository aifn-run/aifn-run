<template component="app-shell">
  <header class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-6 py-5">
    <a class="text-lg font-bold tracking-tight" href="/">ai<span class="text-lime-300">fn</span>.run</a>
    <nav class="hidden gap-5 text-xs text-stone-400 md:flex">
      <a class="hover:text-white" href="/">Home</a><a class="hover:text-white" href="/dashboard">Dashboard</a><a class="hover:text-white" href="/functions?view=list">Functions</a>
    </nav>
    <div>
      <template if="!profile"><a class="rounded border border-stone-700 px-3 py-2 text-xs text-stone-200 hover:border-lime-300" href="/auth/login?return_to=/dashboard">Sign in</a></template
      ><template if="profile"
        ><button class="flex max-w-64 items-center gap-3 rounded-lg border border-stone-700 bg-[#151815] px-3 py-2 text-left hover:border-lime-300" on-click="openProfile()">
          <img class="h-8 w-8 rounded-full object-cover" if="profile.photo" bind-src="profile.photo" alt="" /><span class="flex min-w-0 flex-col"><strong class="truncate text-xs text-stone-100">{{ profile.name || 'Signed in' }}</strong><small class="truncate text-[10px] text-stone-500">{{ profile.email }}</small></span>
        </button></template
      >
    </div>
  </header>
  <script setup>
    import { ref, onInit } from '@li3/web';
    export default function () {
      const profile = ref(null), provider = ref('https://auth.aifn.run');
      const signOut = async () => { await fetch('/auth/logout', { method: 'POST' }); location.href = '/'; };
      const openProfile = () => window.open(`${provider.value}/me`, '_blank', 'noopener,noreferrer');
      onInit(async () => { try { const [session, authProvider] = await Promise.all([fetch('/auth/session'), fetch('/auth/provider')]); if (session.ok) profile.value = (await session.json()).profile; if (authProvider.ok) provider.value = (await authProvider.json()).url; } catch {} });
      return { profile, signOut, openProfile };
    }
  </script>
</template>
