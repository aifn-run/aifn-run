<template component="app-shell">
  <header class="site-header">
    <a class="brand" href="/">ai<span>fn</span>.run</a>
    <nav class="nav"><a href="/">Home</a><a href="/dashboard">Dashboard</a><a href="/functions">Functions</a><a href="/help">Help</a></nav>
    <div class="auth-actions"><template if="!profile"><button class="button" on-click="authenticate()">Sign in</button></template><template if="profile"><button class="button profile-button" on-click="signOut()">{{ profile.name || profile.email || 'Signed in' }} · Sign out</button></template></div>
  </header>
  <script setup>
    import { ref, onInit, onDestroy } from '@li3/web';
    import * as auth from 'https://auth.aifn.run/auth.js';
    export default function () {
      const profile = ref(null), onState = (event) => { profile.value = event.detail || null; };
      const authenticate = () => auth.signIn(true), signOut = () => auth.signOut();
      onInit(async () => { auth.events.addEventListener('state', onState); try { profile.value = await auth.getProfile(); } catch { profile.value = null; } });
      onDestroy(() => auth.events.removeEventListener('state', onState));
      return { profile, authenticate, signOut };
    }
  </script>
</template>
