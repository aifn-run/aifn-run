<template component="function-editor">
  <div class="editor-window">
    <div class="editor-toolbar"><span class="traffic"><i></i><i></i><i></i></span><span class="editor-title">untitled function</span><span class="editor-state">{{ status || 'Draft' }}</span></div>
    <form on-submit="save($event)">
      <div class="editor-main">
        <section class="prompt-pane">
          <div class="editor-tabs"><span class="active">prompt.fn</span><span>preview</span></div>
          <textarea class="prompt-input" bind-value="prompt" spellcheck="false" placeholder="Describe what this function should do...\n\nUse {{ name }} to interpolate a typed input."></textarea>
          <div class="editor-footer"><span>{{ output === 'json' ? 'JSON output' : 'Text output' }}</span><span>{{ inputCount }} inputs</span></div>
        </section>
        <aside class="input-pane">
          <div class="pane-heading"><strong>Inputs</strong><button class="icon-button" type="button" on-click="addInput()">+</button></div>
          <p class="pane-help">Define values available as <code>{{ value }}</code> in the prompt.</p>
          <div class="input-row" for="item of inputs">
            <input class="input-name" bind-value="item.name" placeholder="name" />
            <select bind-value="item.type"><option value="string">string</option><option value="number">number</option><option value="boolean">boolean</option></select>
            <button class="icon-button muted" type="button" on-click="removeInput(item)">×</button>
          </div>
          <button class="add-input" type="button" on-click="addInput()">+ Add input</button>
          <div class="field compact-field"><label for="output">Output</label><select id="output" bind-value="output"><option value="json">JSON</option><option value="text">Text</option></select></div>
          <div class="field compact-field"><label for="model">Model</label><input id="model" bind-value="model" placeholder="default model" /></div>
          <label class="visibility-toggle"><input type="checkbox" bind-checked="isPublic" /> Public</label>
        </aside>
      </div>
      <div class="editor-actions"><details><summary>Provider override</summary><div class="provider-inline"><input bind-value="endpoint" placeholder="Endpoint override" /><input bind-value="key" type="password" placeholder="API key override" autocomplete="new-password" /></div></details><button class="button primary" type="submit" bind-disabled="busy">{{ busy ? 'Saving...' : 'Save version' }}</button></div>
    </form>
    <section class="playground"><div class="playground-heading"><strong>Playground</strong><span>Test the active function</span></div><div class="playground-body"><textarea bind-value="testInput" placeholder='{"name":"Ada","age":36}'></textarea><button class="button" on-click="run()" bind-disabled="!functionId || running">{{ running ? 'Running...' : 'Run' }}</button><pre>{{ result || 'Output will appear here.' }}</pre></div></section>
  </div>
  <script setup>
    import { ref, computed, onInit } from '@li3/web';
    export default function () {
      const name = ref('newFunction'), output = ref('json'), model = ref(''), prompt = ref(''), endpoint = ref(''), key = ref(''), isPublic = ref(false), inputs = ref([{ name: 'text', type: 'string' }]), testInput = ref('{"text":"Hello"}'), result = ref(''), status = ref(''), busy = ref(false), running = ref(false), functionId = ref('');
      const inputCount = computed(() => inputs.value.length);
      function addInput() { inputs.value.push({ name: `value${inputs.value.length + 1}`, type: 'string' }); }
      function removeInput(item) { if (inputs.value.length > 1) inputs.value = inputs.value.filter((value) => value !== item); }
      onInit(async () => { try { const response = await fetch('/api/provider/account', { credentials: 'include' }); if (response.ok) { const defaults = await response.json(); if (!model.value) model.value = defaults.model; } } catch {} });
      async function save(event) { event.preventDefault(); busy.value = true; status.value = 'Saving...'; try { const response = await fetch('/api/fn', { method: 'POST', credentials: 'include', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: name.value, output: output.value, model: model.value, prompt: prompt.value, providerEndpoint: endpoint.value, providerKey: key.value, public: isPublic.value, inputSchema: inputs.value }) }); const body = await response.json(); if (!response.ok) throw new Error(body.error?.message || response.status); functionId.value = body.functionId; key.value = ''; status.value = `v${body.version} saved`; } catch (error) { status.value = error.message; } finally { busy.value = false; } }
      async function run() { running.value = true; try { const response = await fetch(`/api/run/${functionId.value}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ inputs: JSON.parse(testInput.value) }) }); result.value = await response.text(); } catch (error) { result.value = error.message; } finally { running.value = false; } }
      return { name, output, model, prompt, endpoint, key, isPublic, inputs, inputCount, testInput, result, status, busy, running, functionId, addInput, removeInput, save, run };
    }
  </script>
</template>
