<template component="function-editor">
  <section class="editor-section">
    <div class="editor-window">
      <div class="editor-toolbar"><span class="editor-title">aifn.run</span><input class="editor-name" bind-value="name" on-input="setName($event.target.value)" placeholder="function name" /><span class="editor-state">{{ status || 'Draft' }}</span></div>
      <div class="editor-form">
        <div class="editor-main">
          <section class="prompt-pane"><textarea class="prompt-input" bind-value="prompt" on-input="setPrompt($event.target.value)" spellcheck="false" placeholder="Describe what this function should do...\n\nUse {{ name }} to interpolate a typed input."></textarea><div class="editor-footer"><span>{{ output === 'json' ? 'JSON output' : 'Text output' }}</span><span>{{ inputs.length }} inputs</span></div></section>
        <aside class="input-pane"><div class="pane-heading"><strong>Inputs</strong><span class="pane-help">{{ inputs.length ? 'Typed values' : 'No inputs yet' }}</span></div><template for="item of inputs"><div class="input-row"><input class="input-name" bind-value="item.name" on-input="setInputName(item, $event.target.value)" placeholder="name" /><select bind-value="item.type" on-input="setInputType(item, $event.target.value)"><option value="string">string</option><option value="number">number</option><option value="boolean">boolean</option></select><button class="icon-button muted" type="button" on-click="removeInput(item)">×</button></div></template><form class="input-form" on-submit="addInput($event)"><input bind-value="newInputName" on-input="setNewInputName($event.target.value)" placeholder="new input name" /><select bind-value="newInputType" on-input="setNewInputType($event.target.value)"><option value="string">string</option><option value="number">number</option><option value="boolean">boolean</option></select><button class="icon-button plus-button" type="submit" aria-label="Add input">+</button></form><div class="field compact-field"><label for="output">Output</label><select id="output" bind-value="output" on-input="setOutput($event.target.value)"><option value="json">JSON</option><option value="text">Text</option></select></div><div class="field compact-field"><label for="model">Model</label><input id="model" bind-value="model" on-input="setModel($event.target.value)" placeholder="default model" /></div><label class="visibility-toggle"><input type="checkbox" bind-checked="isPublic" on-input="setPublic($event.target.checked)" /> Public</label></aside>
        </div>
        <div class="editor-actions"><span class="status">Use {{ name }} in the prompt.</span><button class="button primary" type="button" on-click="save($event)" bind-disabled="busy">{{ busy ? 'Saving...' : 'Save version' }}</button></div>
      </div>
    </div>
  </section>
  <section class="editor-section playground-section"><div class="playground-heading"><strong>Playground</strong><span>Test the active function</span></div><div class="playground-body"><textarea bind-value="testInput" on-input="setTestInput($event.target.value)" placeholder='{"name":"Ada","age":36}'></textarea><button class="button" on-click="run()" bind-disabled="!functionId || running">{{ running ? 'Running...' : 'Run' }}</button><pre>{{ result || 'Output will appear here.' }}</pre></div></section>
  <script setup>
    import { hook, defineProp, onInit } from '@li3/web';
    export default function () {
      const functionId = defineProp('functionId', { default: '' });
      const [name, setName] = hook(''), [output, setOutput] = hook('json'), [model, setModel] = hook(''), [prompt, setPrompt] = hook(''), [isPublic, setPublic] = hook(false), [inputs, setInputs] = hook([]), [newInputName, setNewInputName] = hook(''), [newInputType, setNewInputType] = hook('string'), [testInput, setTestInput] = hook('{}'), [result, setResult] = hook(''), [status, setStatus] = hook(''), [busy, setBusy] = hook(false), [running, setRunning] = hook(false), [activeId, setActiveId] = hook('');
      function addInput(event) { event?.preventDefault(); const inputName = newInputName.value.trim(); if (!inputName) return; setInputs([...inputs.value, { name: inputName, type: newInputType.value }]); setNewInputName(''); setNewInputType('string'); }
      function removeInput(item) { setInputs(inputs.value.filter((value) => value !== item)); }
      function setInputName(item, value) { setInputs(inputs.value.map((entry) => entry === item ? { ...entry, name: value } : entry)); }
      function setInputType(item, value) { setInputs(inputs.value.map((entry) => entry === item ? { ...entry, type: value } : entry)); }
      async function load() { const id = functionId.value; if (!id) { setName(''); setInputs([]); return; } setActiveId(id); const response = await fetch(`/api/fn/${id}`, { credentials: 'include' }); if (!response.ok) return; const data = await response.json(); setName(data.name); setOutput(data.output); setModel(data.model); setPrompt(data.prompt); setPublic(data.public); setInputs(data.inputSchema || []); }
      async function save(event) { event.preventDefault(); const id = activeId.value || functionId.value; setBusy(true); setStatus('Saving...'); try { const response = await fetch(id ? `/api/fn/${id}` : '/api/fn', { method: id ? 'PUT' : 'POST', credentials: 'include', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: name.value, output: output.value, model: model.value, prompt: prompt.value, public: isPublic.value, inputSchema: inputs.value }) }); const body = await response.json(); if (!response.ok) throw new Error(body.error?.message || response.status); setActiveId(body.functionId); setStatus(`v${body.version} saved`); } catch (error) { setStatus(error.message); } finally { setBusy(false); } }
      async function run() { const id = activeId.value || functionId.value; setRunning(true); try { const response = await fetch(`/api/run/${id}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ inputs: JSON.parse(testInput.value) }) }); setResult(await response.text()); } catch (error) { setResult(error.message); } finally { setRunning(false); } }
      onInit(load);
      return { functionId, name, output, model, prompt, isPublic, inputs, newInputName, newInputType, testInput, result, status, busy, running, activeId, setName, setOutput, setModel, setPrompt, setPublic, setNewInputName, setNewInputType, setTestInput, addInput, removeInput, setInputName, setInputType, save, run };
    }
  </script>
</template>
