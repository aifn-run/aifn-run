<template component="function-editor">
  <div class="editor-window">
    <div class="editor-toolbar"><span class="traffic"><i></i><i></i><i></i></span><span class="editor-title">{{ name || 'untitled function' }}</span><span class="editor-state">{{ status || 'Draft' }}</span></div>
    <form on-submit="save($event)">
      <div class="editor-main">
        <section class="prompt-pane"><div class="editor-tabs"><span class="active">prompt.fn</span><span>preview</span></div><textarea class="prompt-input" bind-value="prompt" on-input="setPrompt($event.target.value)" spellcheck="false" placeholder="Describe what this function should do...\n\nUse {{ name }} to interpolate a typed input."></textarea><div class="editor-footer"><span>{{ output === 'json' ? 'JSON output' : 'Text output' }}</span><span>{{ inputs.length }} inputs</span></div></section>
        <aside class="input-pane"><div class="pane-heading"><strong>Inputs</strong><button class="icon-button" type="button" on-click="addInput()">+</button></div><p class="pane-help">Define values available as <code>{{ value }}</code> in the prompt.</p><div class="input-row" for="item of inputs"><input class="input-name" bind-value="item.name" on-input="setInputName(item, $event.target.value)" placeholder="name" /><select bind-value="item.type" on-input="setInputType(item, $event.target.value)"><option value="string">string</option><option value="number">number</option><option value="boolean">boolean</option></select><button class="icon-button muted" type="button" on-click="removeInput(item)">×</button></div><button class="add-input" type="button" on-click="addInput()">+ Add input</button><div class="field compact-field"><label for="output">Output</label><select id="output" bind-value="output" on-input="setOutput($event.target.value)"><option value="json">JSON</option><option value="text">Text</option></select></div><div class="field compact-field"><label for="model">Model</label><input id="model" bind-value="model" on-input="setModel($event.target.value)" placeholder="default model" /></div><label class="visibility-toggle"><input type="checkbox" bind-checked="isPublic" on-input="setPublic($event.target.checked)" /> Public</label></aside>
      </div>
      <div class="editor-actions"><span class="status">JSON and text inputs are sanitized before execution.</span><button class="button primary" type="submit" bind-disabled="busy">{{ busy ? 'Saving...' : 'Save version' }}</button></div>
    </form>
    <section class="playground"><div class="playground-heading"><strong>Playground</strong><span>Test the active function</span></div><div class="playground-body"><textarea bind-value="testInput" on-input="setTestInput($event.target.value)" placeholder='{"name":"Ada","age":36}'></textarea><button class="button" on-click="run()" bind-disabled="!functionId || running">{{ running ? 'Running...' : 'Run' }}</button><pre>{{ result || 'Output will appear here.' }}</pre></div></section>
  </div>
  <script setup>
    import { hook, defineProp, onInit } from '@li3/web';
    export default function () {
      const functionId = defineProp('functionId', { default: '' });
      const [name, setName] = hook('newFunction'), [output, setOutput] = hook('json'), [model, setModel] = hook(''), [prompt, setPrompt] = hook(''), [isPublic, setPublic] = hook(false), [inputs, setInputs] = hook([{ name: 'text', type: 'string' }]), [testInput, setTestInput] = hook('{"text":"Hello"}'), [result, setResult] = hook(''), [status, setStatus] = hook(''), [busy, setBusy] = hook(false), [running, setRunning] = hook(false), [activeId, setActiveId] = hook('');
      function addInput() { setInputs([...inputs.value, { name: `value${inputs.value.length + 1}`, type: 'string' }]); }
      function removeInput(item) { if (inputs.value.length > 1) setInputs(inputs.value.filter((value) => value !== item)); }
      function setInputName(item, value) { setInputs(inputs.value.map((entry) => entry === item ? { ...entry, name: value } : entry)); }
      function setInputType(item, value) { setInputs(inputs.value.map((entry) => entry === item ? { ...entry, type: value } : entry)); }
      async function load() { const id = functionId.value; if (!id) return; setActiveId(id); const response = await fetch(`/api/fn/${id}`, { credentials: 'include' }); if (!response.ok) return; const data = await response.json(); setName(data.name); setOutput(data.output); setModel(data.model); setPrompt(data.prompt); setPublic(data.public); setInputs(data.inputSchema?.length ? data.inputSchema : [{ name: 'text', type: 'string' }]); }
      async function save(event) { event.preventDefault(); const id = activeId.value || functionId.value; setBusy(true); setStatus('Saving...'); try { const response = await fetch(id ? `/api/fn/${id}` : '/api/fn', { method: id ? 'PUT' : 'POST', credentials: 'include', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: name.value, output: output.value, model: model.value, prompt: prompt.value, public: isPublic.value, inputSchema: inputs.value }) }); const body = await response.json(); if (!response.ok) throw new Error(body.error?.message || response.status); setActiveId(body.functionId); setStatus(`v${body.version} saved`); } catch (error) { setStatus(error.message); } finally { setBusy(false); } }
      async function run() { const id = activeId.value || functionId.value; setRunning(true); try { const response = await fetch(`/api/run/${id}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ inputs: JSON.parse(testInput.value) }) }); setResult(await response.text()); } catch (error) { setResult(error.message); } finally { setRunning(false); } }
      onInit(load);
      return { functionId, name, output, model, prompt, isPublic, inputs, testInput, result, status, busy, running, activeId, setName, setOutput, setModel, setPrompt, setPublic, setTestInput, addInput, removeInput, setInputName, setInputType, save, run };
    }
  </script>
</template>
