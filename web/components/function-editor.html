<template component="function-editor">
  <section class="mb-4">
    <div class="overflow-hidden rounded-lg border border-stone-700 bg-[#0d0f0d] shadow-2xl">
      <div class="flex min-h-10 items-center gap-3 border-b border-stone-700 bg-[#1a1d19] px-3 text-xs text-stone-400"><span class="font-bold text-lime-300">aifn.run</span><input class="w-72 border-b border-stone-700 bg-transparent px-1 py-1 font-mono text-xs text-stone-100 outline-none focus:border-lime-300" bind-value="name" on-input="setName($event.target.value)" placeholder="function name" /><span class="ml-auto">{{ status || 'Draft' }}</span></div>
      <div>
        <div class="grid min-h-[460px] grid-cols-[minmax(0,1fr)_250px] max-md:grid-cols-1">
          <section class="flex flex-col border-r border-stone-700 max-md:border-r-0 max-md:border-b"><textarea class="min-h-[380px] flex-1 resize-none border-0 bg-[#0b0d0b] p-5 font-mono text-sm leading-7 text-stone-100 outline-none" bind-value="prompt" on-input="setPrompt($event.target.value)" spellcheck="false" placeholder="Describe what this function should do...\n\nUse {{ name }} to interpolate a typed input."></textarea><div class="flex justify-between border-t border-stone-700 px-4 py-2 text-xs text-stone-500"><span>{{ output === 'json' ? 'JSON output' : 'Text output' }}</span><span>{{ inputs.length }} inputs</span></div></section>
        <aside class="bg-[#151815] p-4"><div class="flex items-center justify-between"><strong>Inputs</strong><span class="text-xs text-stone-500">{{ inputs.length ? 'Typed values' : 'No inputs yet' }}</span></div><template for="item of inputs"><div class="my-2 grid grid-cols-[minmax(0,1fr)_5rem_1.2rem] gap-1"><input class="min-w-0 rounded border border-stone-700 bg-[#0b0d0b] px-2 py-1 text-xs text-stone-100" bind-value="item.name" on-input="setInputName(item, $event.target.value)" placeholder="name" /><select class="rounded border border-stone-700 bg-[#0b0d0b] px-1 py-1 text-xs text-stone-100" bind-value="item.type" on-input="setInputType(item, $event.target.value)"><option value="string">string</option><option value="number">number</option><option value="boolean">boolean</option></select><button class="text-stone-500 hover:text-white" type="button" on-click="removeInput(item)">×</button></div></template><form class="mt-3 grid grid-cols-[minmax(0,1fr)_5rem_1.2rem] gap-1 border-t border-dashed border-stone-700 pt-3" on-submit="addInput($event)"><input class="min-w-0 rounded border border-stone-700 bg-[#0b0d0b] px-2 py-1 text-xs text-stone-100" bind-value="newInputName" on-input="setNewInputName($event.target.value)" placeholder="new input name" /><select class="rounded border border-stone-700 bg-[#0b0d0b] px-1 py-1 text-xs text-stone-100" bind-value="newInputType" on-input="setNewInputType($event.target.value)"><option value="string">string</option><option value="number">number</option><option value="boolean">boolean</option></select><button class="text-lg text-lime-300" type="submit" aria-label="Add input">+</button></form><div class="mt-5 grid gap-1"><label class="text-xs text-stone-500" for="output">Output</label><select id="output" class="rounded border border-stone-700 bg-[#0b0d0b] px-2 py-2 text-xs text-stone-100" bind-value="output" on-input="setOutput($event.target.value)"><option value="json">JSON</option><option value="text">Text</option></select></div><div class="mt-4 grid gap-1"><label class="text-xs text-stone-500" for="model">Model</label><input id="model" class="rounded border border-stone-700 bg-[#0b0d0b] px-2 py-2 text-xs text-stone-100" bind-value="model" on-input="setModel($event.target.value)" placeholder="default model" /></div><label class="mt-4 flex items-center gap-2 text-xs text-stone-200"><input type="checkbox" bind-checked="isPublic" on-input="setPublic($event.target.checked)" /> Public</label></aside>
        </div>
        <div class="flex items-center justify-between gap-4 border-t border-stone-700 px-4 py-3"><span class="text-xs text-stone-500">Use {{ name }} in the prompt.</span><button class="rounded bg-lime-300 px-4 py-2 text-xs font-bold text-stone-950 hover:bg-lime-200" type="button" on-click="save($event)" bind-disabled="busy">{{ busy ? 'Saving...' : 'Save version' }}</button></div>
      </div>
    </div>
  </section>
  <section class="overflow-hidden rounded-lg border border-stone-700 bg-[#121512]"><div class="flex gap-4 px-4 py-3"><strong>Playground</strong><span class="text-xs text-stone-500">Test the active function</span></div><div class="grid grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] gap-3 px-4 pb-4 max-md:grid-cols-1"><textarea class="min-h-24 resize-y rounded border border-stone-700 bg-[#0b0d0b] p-3 font-mono text-xs text-stone-100" bind-value="testInput" on-input="setTestInput($event.target.value)" placeholder='{"name":"Ada","age":36}'></textarea><button class="self-start rounded border border-stone-700 px-3 py-2 text-xs text-stone-100 hover:border-lime-300" on-click="run()" bind-disabled="!functionId || running">{{ running ? 'Running...' : 'Run' }}</button><pre class="m-0 min-h-24 overflow-auto whitespace-pre-wrap rounded border border-stone-700 bg-[#0b0d0b] p-3 font-mono text-xs text-stone-100">{{ result || 'Output will appear here.' }}</pre></div></section>
  <script setup>
    import { hook, defineProp, onInit } from '@li3/web';
    export default function () {
      const functionId = defineProp('functionId', { default: '' });
      const [name, setName] = hook(''), [output, setOutput] = hook('json'), [model, setModel] = hook(''), [prompt, setPrompt] = hook(''), [isPublic, setPublic] = hook(false), [inputs, setInputs] = hook([]), [newInputName, setNewInputName] = hook(''), [newInputType, setNewInputType] = hook('string'), [testInput, setTestInput] = hook('{}'), [result, setResult] = hook(''), [status, setStatus] = hook(''), [busy, setBusy] = hook(false), [running, setRunning] = hook(false), [activeId, setActiveId] = hook('');
      function addInput(event) { event?.preventDefault(); const inputName = newInputName.value.trim(); if (!inputName) return; setInputs([...inputs.value, { name: inputName, type: newInputType.value }]); setNewInputName(''); setNewInputType('string'); }
      function removeInput(item) { setInputs(inputs.value.filter((value) => value !== item)); }
      function setInputName(item, value) { setInputs(inputs.value.map((entry) => entry === item ? { ...entry, name: value } : entry)); }
      function setInputType(item, value) { setInputs(inputs.value.map((entry) => entry === item ? { ...entry, type: value } : entry)); }
      async function load() { const id = functionId.value; if (!id) { setName(''); setInputs([]); return; } setActiveId(id); const response = await fetch(`/api/fn/${id}`, { credentials: 'include' }); if (!response.ok) return; const data = await response.json(); setName(data.name); setOutput(data.output); setModel(data.model); setPrompt(data.prompt); setPublic(data.public); setInputs(data.inputSchema || []); }
      async function save(event) { event.preventDefault(); const id = activeId.value || functionId.value; setBusy(true); setStatus('Saving...'); try { const response = await fetch(id ? `/api/fn/${id}` : '/api/fn', { method: id ? 'PUT' : 'POST', credentials: 'include', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: name.value, output: output.value, model: model.value, prompt: prompt.value, public: isPublic.value, inputSchema: inputs.value }) }); const body = await response.json(); if (!response.ok) throw new Error(body.error?.message || response.status); setActiveId(body.functionId); setStatus(`v${body.version} saved`); } catch (error) { setStatus(error.message); } finally { setBusy(false); } }
      async function run() { const id = activeId.value || functionId.value; setRunning(true); try { const response = await fetch(`/api/run/${id}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ inputs: JSON.parse(testInput.value) }) }); setResult(await response.text()); } catch (error) { setResult(error.message); } finally { setRunning(false); } }
      onInit(load);
      return { functionId, name, output, model, prompt, isPublic, inputs, newInputName, newInputType, testInput, result, status, busy, running, activeId, setName, setOutput, setModel, setPrompt, setPublic, setNewInputName, setNewInputType, setTestInput, addInput, removeInput, setInputName, setInputType, save, run };
    }
  </script>
</template>
