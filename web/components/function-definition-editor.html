<template component="function-definition-editor">
  <link rel="component" href="/components/function-client-snippet.html" />
  <section class="mx-auto font-mono text-sm leading-8 text-stone-200">
    <div class="overflow-x-auto rounded-lg p-5">
      <div class="whitespace-nowrap">
        <span class="text-violet-300">function</span>
        <input
          class="w-56 bg-transparent text-lime-300 outline-none"
          bind-value="functionName"
          on-input="(setFunctionName($event.target.value), $event.target.style.width = (9 * ($event.target.value.length || 1)) + 'px')"
          placeholder="functionName"
          aria-label="Function name"
        />
        <span>(</span>
      </div>

      <div class="ml-6 space-y-0">
        <template for="item of inputs"
          ><div class="flex flex-wrap items-center gap-2">
            <input
              class="w-40 bg-transparent text-lime-300 outline-none"
              bind-value="item.name"
              on-input="(setInputName(item, $event.target.value), $event.target.style.width = (9 * ($event.target.value.length || 1)) + 'px')"
              placeholder="inputName"
              aria-label="Input name"
            /><span>:</span
            ><select
              class="bg-transparent px-2 py-1 text-amber-300 outline-none"
              bind-value="item.type"
              on-input="setInputType(item, $event.target.value)"
              aria-label="Input type"
            >
              <option value="string">string</option>
              <option value="number">number</option>
              <option value="boolean">boolean</option></select
            ><span>,</span
            ><button
              class="text-stone-500 hover:text-red-300"
              type="button"
              on-click="removeInput(item)"
              aria-label="Remove input"
            >
              ×
            </button>
          </div></template
        >
        <div class="flex flex-wrap items-center gap-2">
          <input
            class="w-40 bg-transparent text-lime-300 outline-none"
            bind-value="newInputName"
            on-input="(setNewInputName($event.target.value), $event.target.style.width = (9 * ($event.target.value.length || 1)) + 'px')"
            placeholder="inputName"
            aria-label="New input name"
          /><span>:</span
          ><select
            class="bg-transparent px-2 py-1 text-amber-300 outline-none"
            bind-value="newInputType"
            on-input="setNewInputType($event.target.value)"
            aria-label="New input type"
          >
            <option value="string">string</option>
            <option value="number">number</option>
            <option value="boolean">boolean</option></select
          ><button
            class="px-2 leading-7 text-lime-300 hover:text-lime-200"
            type="button"
            on-click="addInput()"
            aria-label="Add input"
          >
            +
          </button>
        </div>
      </div>
      <div>) {</div>

      <div class="ml-6 space-y-1 py-3">
        <div>
          <span class="text-violet-300">const</span> output =
          <select
            class="bg-transparent px-2 py-1 text-amber-300 outline-none"
            bind-value="output"
            on-input="setOutput($event.target.value)"
            aria-label="Output format"
          >
            <option value="json">"json"</option>
            <option value="text">"text"</option>
          </select>
        </div>
        <div>
          <span class="text-violet-300">const</span> provider =
          <select
            class="max-w-[min(100%,24rem)] bg-transparent px-2 py-1 text-amber-300 outline-none"
            bind-value="providerSlug"
            on-input="setProviderSlug($event.target.value)"
            aria-label="Provider"
          >
            <option value="">default</option>
            <template for="provider of providers"
              ><option bind-value="provider.slug">{{ provider.slug }}</option></template
            >
          </select>
        </div>
        <div>
          <span class="text-violet-300">const</span> model =
          <input
            class="w-56 bg-transparent text-amber-300 outline-none"
            bind-value="model"
            on-input="(setModel($event.target.value), $event.target.style.width = (9 * ($event.target.value.length || 1)) + 'px')"
            bind-placeholder="modelPlaceholder"
            aria-label="Model"
          />
        </div>
        <div>
          <span class="text-violet-300">const</span> public =
          <button
            class="border-0 bg-transparent p-0 text-cyan-300 hover:underline"
            type="button"
            on-click="togglePublic()"
            bind-aria-pressed="isPublic"
          >
            {{ isPublic ? 'true' : 'false' }}
          </button>
        </div>
        <div>
          <div><span class="text-violet-300">const</span> prompt = <span class="text-amber-300">`</span></div>
          <textarea
            id="function-prompt"
            class="ml-4 w-[min(100%-1rem,68rem)] resize-none overflow-y-auto rounded bg-transparent p-3 text-sm leading-7 text-amber-300 outline-none"
            rows="3"
            bind-value="prompt"
            on-input="updatePrompt($event)"
            placeholder="Write instructions. Interpolate with named inputs."
            aria-label="Function prompt"
          ></textarea>
          <div class="ml-4 text-amber-300">`;</div>
        </div>
      </div>
      <div>}</div>
    </div>

    <footer class="mt-4 flex flex-wrap items-center gap-3">
      <button
        class="rounded border border-stone-700 px-4 py-2 hover:border-stone-400"
        type="button"
        on-click="cancel()"
      >
        cancel
      </button>
      <template if="activeId">
        <button
          class="rounded border border-red-900 bg-red-950/30 px-4 py-2 text-red-300 hover:border-red-500 hover:bg-red-950/60 disabled:opacity-50"
          type="button"
          on-click="deleteFunction()"
          bind-disabled="saving"
        >
          delete
        </button>
      </template>
      <button
        class="rounded bg-lime-300 px-4 py-2 font-bold text-stone-950 hover:bg-lime-200 disabled:opacity-50"
        type="button"
        on-click="save()"
        bind-disabled="saving"
      >
        {{ saving ? 'saving...' : 'save' }}
      </button>
      <span class="text-xs text-stone-500">{{ status }}</span>
    </footer>
    <template if="activeId">
      <function-client-snippet
        bind-function-id="activeId"
        bind-input-schema="inputs"
        bind-function-name="functionName"
        bind-output="output"
      ></function-client-snippet>
    </template>
  </section>

  <script setup>
    import { computed, defineProp, hook, onInit } from "@li3/web";

    export default function () {
      const functionId = defineProp("functionId", { default: "" });
      const onCancel = defineProp("onCancel", { default: () => {} });
      const onSaved = defineProp("onSaved", { default: () => {} });
      const [functionName, setFunctionName] = hook("");
      const [prompt, setPrompt] = hook("");
      const [model, setModel] = hook("");
      const [providerSlug, setProviderSlug] = hook("");
      const [output, setOutput] = hook("json");
      const [inputs, setInputs] = hook([]);
      const [newInputName, setNewInputName] = hook("");
      const [newInputType, setNewInputType] = hook("string");
      const [isPublic, setPublic] = hook(false);
      const [providers, setProviders] = hook([]);
      const [activeId, setActiveId] = hook(functionId.value || "");
      const [status, setStatus] = hook("");
      const [saving, setSaving] = hook(false);
      const modelPlaceholder = computed(() => {
        const selectedProvider = providers.value.find((provider) => provider.slug === providerSlug.value);
        return selectedProvider?.defaultModel || "provider default";
      });

      function addInput() {
        const name = newInputName.value.trim();
        if (!name) {
          return;
        }
        setInputs([...inputs.value, { name, type: newInputType.value }]);
        setNewInputName("");
        setNewInputType("string");
      }

      function removeInput(item) {
        setInputs(inputs.value.filter((input) => input !== item));
      }

      function setInputName(item, name) {
        setInputs(inputs.value.map((input) => (input === item ? { ...input, name } : input)));
      }

      function setInputType(item, type) {
        setInputs(inputs.value.map((input) => (input === item ? { ...input, type } : input)));
      }

      function togglePublic() {
        setPublic(!isPublic.value);
      }

      function resizePrompt(textarea) {
        const lineHeight = Number.parseFloat(getComputedStyle(textarea).lineHeight) || 28;
        const verticalPadding =
          Number.parseFloat(getComputedStyle(textarea).paddingTop) +
          Number.parseFloat(getComputedStyle(textarea).paddingBottom);
        const maxHeight = lineHeight * 30 + verticalPadding;
        textarea.style.height = "auto";
        textarea.style.height = `${Math.min(textarea.scrollHeight, maxHeight)}px`;
      }

      function updatePrompt(event) {
        setPrompt(event.target.value);
        resizePrompt(event.target);
      }

      async function load() {
        const providerResponse = await fetch("/api/providers", { credentials: "include" });
        setProviders(providerResponse.ok ? await providerResponse.json() : []);
        if (!functionId.value) {
          return;
        }

        setActiveId(functionId.value);
        const response = await fetch(`/api/fn/${functionId.value}`, { credentials: "include" });
        if (!response.ok) {
          setStatus("Unable to load function");
          return;
        }

        const data = await response.json();
        setFunctionName(data.name || "");
        setPrompt(data.prompt || "");
        setModel(data.model || "");
        setProviderSlug(data.providerSlug || "");
        setOutput(data.output || "json");
        setInputs(data.inputSchema || []);
        setPublic(data.public);
        requestAnimationFrame(() => {
          const textarea = document.getElementById("function-prompt");
          if (textarea) {
            resizePrompt(textarea);
          }
        });
      }

      function cancel() {
        onCancel.value();
      }

      async function save() {
        setSaving(true);
        setStatus("");
        try {
          const id = activeId.value || functionId.value;
          const response = await fetch(id ? `/api/fn/${id}` : "/api/fn", {
            method: id ? "PUT" : "POST",
            credentials: "include",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              name: functionName.value,
              prompt: prompt.value,
              model: model.value,
              providerSlug: providerSlug.value,
              output: output.value,
              public: isPublic.value,
              inputSchema: inputs.value,
            }),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error?.message || response.status);
          }
          setActiveId(data.functionId);
          setStatus(`saved v${data.version}`);
          onSaved.value(data.functionId);
        } catch (error) {
          setStatus(error.message);
        } finally {
          setSaving(false);
        }
      }

      async function deleteFunction() {
        const id = activeId.value;
        if (!id || !window.confirm(`Delete "${functionName.value || "this function"}" and all its versions?`)) {
          return;
        }

        setSaving(true);
        setStatus("");
        try {
          const response = await fetch(`/api/fn/${id}`, { method: "DELETE", credentials: "include" });
          if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            throw new Error(data.error?.message || `Delete failed (${response.status})`);
          }
          onCancel.value();
        } catch (error) {
          setStatus(error.message);
        } finally {
          setSaving(false);
        }
      }

      onInit(load);
      return {
        functionName,
        prompt,
        model,
        providerSlug,
        output,
        inputs,
        newInputName,
        newInputType,
        isPublic,
        providers,
        activeId,
        modelPlaceholder,
        status,
        saving,
        setFunctionName,
        setPrompt,
        setModel,
        setProviderSlug,
        setOutput,
        setNewInputName,
        setNewInputType,
        addInput,
        removeInput,
        setInputName,
        setInputType,
        togglePublic,
        updatePrompt,
        cancel,
        save,
        deleteFunction,
      };
    }
  </script>
</template>
