<template component="function-client-snippet">
  <link rel="component" href="https://sodium.static.apphor.de/code-block.html" />
  <section class="mt-6 overflow-hidden rounded-lg bg-[#282c34]">
    <header class="flex flex-wrap items-center justify-between gap-3 border-b border-stone-600 px-3 py-2">
      <span class="text-sm text-stone-400">How to use it:</span>
      <button
        class="rounded border border-stone-700 px-3 py-1 text-xs text-stone-300 hover:border-lime-300 hover:text-lime-300"
        type="button"
        on-click="copy()"
        aria-label="Copy code snippet"
      >
        {{ copyStatus || 'Copy' }}
      </button>
    </header>
    <div class="overflow-x-auto p-1 text-xs leading-6">
      <code-block
        class="block max-w-full"
        bind-source="snippet"
        language="javascript"
        theme="atom-one-dark"
      ></code-block>
    </div>
  </section>
  <script setup>
    import { computed, defineProp, hook } from "@li3/web";

    const reservedNames = new Set([
      "arguments",
      "await",
      "break",
      "case",
      "catch",
      "class",
      "const",
      "continue",
      "debugger",
      "default",
      "delete",
      "do",
      "else",
      "enum",
      "eval",
      "export",
      "extends",
      "false",
      "finally",
      "for",
      "function",
      "if",
      "implements",
      "import",
      "in",
      "instanceof",
      "interface",
      "let",
      "new",
      "null",
      "package",
      "private",
      "protected",
      "public",
      "return",
      "static",
      "super",
      "switch",
      "this",
      "throw",
      "true",
      "try",
      "typeof",
      "var",
      "void",
      "while",
      "with",
      "yield",
    ]);

    function exampleInputs(schema) {
      return Object.fromEntries(
        (Array.isArray(schema) ? schema : []).map((input) => [
          input.name,
          input.type === "number" ? 0 : input.type === "boolean" ? false : "",
        ]),
      );
    }

    export default function () {
      const functionId = defineProp("functionId", { default: "" });
      const inputSchema = defineProp("inputSchema", { default: [] });
      const functionName = defineProp("functionName", { default: "" });
      const output = defineProp("output", { default: "json" });
      const [copyStatus, setCopyStatus] = hook("");

      const snippet = computed(() => {
        const id = functionId.value;
        const safeName = String(functionName.value || "").replace(/[^A-Za-z0-9_$]/g, "_");
        const importName =
          !safeName || /^\d/.test(safeName) || reservedNames.has(safeName) ? `fn_${id.slice(0, 8)}` : safeName;
        const outputName = output.value === "json" ? "json" : "text";
        const inputs = JSON.stringify(exampleInputs(inputSchema.value), null, 2);
        const moduleUrl = `https://aifn.run/fn/${id}.mjs`;
        return `import ${importName} from "${moduleUrl}";
const ${outputName} = await ${importName}(${inputs});`;
      });

      async function copy() {
        try {
          await navigator.clipboard.writeText(snippet.value);
          setCopyStatus("Copied");
        } catch {
          setCopyStatus("Copy unavailable");
        }
      }

      return { snippet, copyStatus, copy };
    }
  </script>
</template>
